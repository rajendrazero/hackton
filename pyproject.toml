[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x-cli"
version = "0.1.0"
description = "A safety-first security assessment CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7,<16",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[project.scripts]
sentinel = "sentinel_x.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
